[project]
name = "mcp-wled"
version = "0.1.0"
description = "MCP server for controlling a WLED 16x16 LED matrix"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
mcp-wled = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
