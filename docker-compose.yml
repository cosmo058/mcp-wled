services:
  mcp-wled:
    build: .
    restart: unless-stopped
    stdin_open: true
    tty: false
    env_file:
      - .env
    environment:
      - WLED_HOST=${WLED_HOST:-wled.local}
      - WLED_PORT=${WLED_PORT:-80}
      - MATRIX_WIDTH=${MATRIX_WIDTH:-16}
      - MATRIX_HEIGHT=${MATRIX_HEIGHT:-16}
      - MATRIX_SERPENTINE=${MATRIX_SERPENTINE:-false}
      - DEFAULT_BRIGHTNESS=${DEFAULT_BRIGHTNESS:-128}
    network_mode: host
